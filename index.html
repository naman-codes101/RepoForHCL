<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Task Manager</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="wrap">
    <h1>Student Task Manager</h1>

    <section aria-label="Task summary">
      <div class="stats">
        <div class="stat"><b id="statTotal">0</b><span>Total</span></div>
        <div class="stat"><b id="statPending">0</b><span>Pending</span></div>
        <div class="stat"><b id="statDone">0</b><span>Completed</span></div>
        <div class="stat"><b id="statOverdue">0</b><span>Overdue</span></div>
      </div>
      <div class="bar" role="progressbar" aria-label="Completion" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="progress"></i></div>
    </section>

    <form id="taskForm" class="panel form">
      <div class="full">
        <label for="title">Title</label>
        <input id="title" maxlength="100" required placeholder="e.g. Finish DBMS assignment">
      </div>
      <div class="full">
        <label for="description">Description</label>
        <textarea id="description" maxlength="500" placeholder="Chapters, links, notes"></textarea>
      </div>
      <div>
        <label for="dueDate">Due date</label>
        <input id="dueDate" type="date">
      </div>
      <div>
        <label for="priority">Priority</label>
        <select id="priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </div>
      <div class="full end">
        <button type="button" class="btn" id="cancelEdit" hidden>Cancel</button>
        <button type="submit" class="btn primary" id="submitBtn">Add task</button>
      </div>
    </form>

    <div class="filters">
      <input id="search" type="search" placeholder="Search tasks" aria-label="Search tasks">
      <select id="filterStatus" aria-label="Filter by status">
        <option value="all">All statuses</option>
        <option value="pending">Pending</option>
        <option value="completed">Completed</option>
      </select>
      <select id="filterPriority" aria-label="Filter by priority">
        <option value="all">All priorities</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
      <select id="sortBy" aria-label="Sort tasks">
        <option value="due">Sort by due date</option>
        <option value="priority">Sort by priority</option>
        <option value="newest">Sort by newest</option>
      </select>
    </div>

    <ul id="taskList" class="list"></ul>
    <div class="end"><button class="btn small" id="clearDone">Clear completed</button></div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
